# Runs on every push to main, dev and feature branches, and on pull requests into main and dev.
# It is the same set of checks as `npm run verify` on a developer machine, plus the dependency audit.
name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

# The workflow can only read the repository; it can write nothing.
permissions:
  contents: read

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres 17 for the API tests (the same version as docker-compose.yml).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toobler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toobler_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toobler_test

    steps:
      # Actions are pinned to exact commits (the version is in the comment), so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Exactly the versions in package-lock.json; install scripts are off (.npmrc).
      - run: npm ci

      - name: Gate (one feature at a time)
        run: npm run gate

      - name: Formatting
        run: npm run format:check

      - name: Lint (layers, module boundaries, names)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests (API with the database, and the tooling tests)
        run: npm test

      - name: Dependency audit (high findings fail the build) and package signatures
        run: npm run audit:deps

      # The browser tests start their own copy of the web app and run at phone and desktop size.
      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (navigation, theme, layout, accessibility)
        run: npm run e2e

      - name: Keep the test report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
