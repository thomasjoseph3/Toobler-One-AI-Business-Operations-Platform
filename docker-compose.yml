# Local services for development and tests. Only the test database for now (Mailpit joins with F01, pgvector with F18).
# Bound to 127.0.0.1 only. The credentials are throwaway and only work on this machine.
services:
  db-test:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:54329:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toobler_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d toobler_test']
      interval: 2s
      timeout: 3s
      retries: 20
